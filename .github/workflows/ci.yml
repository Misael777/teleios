name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Código generado de Drift al día
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/

      - name: Formato (excluye código generado)
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' ! -name '*.g.dart')

      - run: flutter analyze

      - run: flutter test --coverage

      - name: Cobertura de dominio
        run: |
          sudo apt-get install -y lcov > /dev/null
          lcov --extract coverage/lcov.info '*/domain/*' '*/infrastructure/ai/*' -o coverage/domain.info > /dev/null
          lcov --summary coverage/domain.info

  android:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug --dart-define-from-file=config/dev.json

      - uses: actions/upload-artifact@v4
        with:
          name: teleios-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
